<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MaidFinder Ethiopia</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f6f8);
      --text-color: var(--tg-theme-text-color, #111111);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --btn-color: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #888888);
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 16px;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .badge {
      background: #e1f5fe; color: #0288d1;
      font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 6px;
    }
    button {
      background-color: var(--btn-color);
      color: var(--btn-text);
      border: none; padding: 12px; border-radius: 8px;
      font-weight: bold; width: 100%; cursor: pointer; margin-top: 8px;
    }
    input, select {
      width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc;
      border-radius: 6px; box-sizing: border-box;
    }
    .hidden { display: none; }
    .telebirr-box {
      background: #f0fdf4; border: 1px dashed #16a34a;
      padding: 12px; border-radius: 8px; text-align: center; margin: 10px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>MaidFinder Ethiopia</h2>
    <p style="color: var(--hint-color); font-size: 13px;">Find trusted domestic helpers in Addis Ababa</p>
  </div>

  <!-- MAIDS LIST SECTION -->
  <div id="maids-list">
    <p id="loading-txt">Loading verified candidates...</p>
  </div>

  <!-- PAYMENT & RECEIPT SECTION -->
  <div id="payment-section" class="card hidden">
    <h3>Complete Agency Fee</h3>
    <p style="font-size: 13px; color: var(--hint-color);">Send the matching fee via Telebirr to unlock maid direct contact.</p>
    
    <div class="telebirr-box">
      <div style="font-weight: bold; color: #16a34a;">Telebirr Transfer Number</div>
      <div style="font-size: 18px; font-weight: bold; margin: 4px 0;">+251938967996</div>
      <div style="font-size: 12px; color: #555;">Account Name: MaidFinder Admin</div>
    </div>

    <form id="receipt-form" onsubmit="submitPayment(event)">
      <input type="hidden" id="active-booking-id">
      
      <label style="font-size: 12px; font-weight: bold;">Transaction Reference (e.g. 9AB...):</label>
      <input type="text" id="tx-ref" placeholder="Enter Telebirr Txn Ref" required>

      <label style="font-size: 12px; font-weight: bold;">Upload Receipt Screenshot:</label>
      <input type="file" id="receipt-file" accept="image/*" required>

      <button type="submit" id="pay-btn">Submit Payment Receipt</button>
    </form>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const headers = {
      'Content-Type': 'application/json',
      'x-telegram-init-data': tg.initData || ''
    };

    async function loadMaids() {
      try {
        const res = await fetch('/api/maids', { headers });
        const data = await res.json();
        
        if (!data.success) throw new Error(data.error);

        const container = document.getElementById('maids-list');
        container.innerHTML = '';

        data.maids.forEach(maid => {
          container.innerHTML += `
            <div class="card">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong style="font-size: 16px;">${maid.name}</strong>
                <span class="badge">${maid.verified ? 'VERIFIED' : 'PENDING'}</span>
              </div>
              <p style="font-size: 13px; margin: 6px 0;">
                <strong>Exp:</strong> ${maid.experience} | <strong>Age:</strong> ${maid.age}<br>
                <strong>Skills:</strong> ${maid.skills.join(', ')}<br>
                <strong>Expected Salary:</strong> ${maid.salary}
              </p>
              <button onclick="bookMaid('${maid.id}')">Hire / Request Contact</button>
            </div>
          `;
        });
      } catch (err) {
        document.getElementById('maids-list').innerHTML = `<p style="color:red;">Error loading profiles. Ensure you opened inside Telegram.</p>`;
      }
    }

    async function bookMaid(maidId) {
      tg.HapticFeedback.impactOccurred('medium');
      try {
        const res = await fetch('/api/bookings', {
          method: 'POST',
          headers,
          body: JSON.stringify({ maidId, requirement: 'Full-time live-in' })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('active-booking-id').value = data.booking.id;
          document.getElementById('payment-section').classList.remove('hidden');
          window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
          tg.showAlert('Booking initiated! Please send payment via Telebirr and upload screenshot below.');
        }
      } catch (err) {
        tg.showAlert('Failed to process request.');
      }
    }

    async function submitPayment(e) {
      e.preventDefault();
      tg.HapticFeedback.impactOccurred('heavy');
      
      const btn = document.getElementById('pay-btn');
      btn.innerText = 'Uploading...';
      btn.disabled = true;

      const formData = new FormData();
      formData.append('bookingId', document.getElementById('active-booking-id').value);
      formData.append('transactionRef', document.getElementById('tx-ref').value);
      formData.append('receiptImage', document.getElementById('receipt-file').files[0]);

      try {
        const res = await fetch('/api/payments/telebirr', {
          method: 'POST',
          headers: { 'x-telegram-init-data': tg.initData || '' },
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          tg.showAlert('Receipt Received! We will confirm your Telebirr payment shortly and unlock contact info.');
          document.getElementById('payment-section').innerHTML = `<div style="text-align:center; color:#16a34a; font-weight:bold;">Payment Received. Verification Pending.</div>`;
        } else {
          alert(data.error || 'Upload failed');
          btn.disabled = false;
          btn.innerText = 'Submit Payment Receipt';
        }
      } catch (err) {
        alert('Upload Error');
        btn.disabled = false;
        btn.innerText = 'Submit Payment Receipt';
      }
    }

    loadMaids();
  </script>
</body>
</html>
